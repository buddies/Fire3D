[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fire3d"
version = "0.1.0"
description = "Feed-forward interactive 3D scene reconstruction"
readme = "README.md"
requires-python = ">=3.10,<3.11"
license = {file = "LICENSE"}
authors = [
  {name = "Hongchi Xia"},
  {name = "Tianhang Cheng"},
  {name = "Wei-Chiu Ma"},
  {name = "Shenlong Wang"},
]
dependencies = [
  "easydict==1.13",
  "einops==0.8.2",
  "ftfy==6.3.1",
  "huggingface-hub>=0.34,<2",
  "imageio==2.37.3",
  "kornia==0.8.2",
  "manifold3d==3.5.1",
  "numpy==1.26.4",
  "omegaconf==2.3.0",
  "open3d==0.19.0",
  "opencv-python-headless==4.11.0.86",
  "pillow>=11,<13",
  "plyfile==1.1.3",
  "pygltflib==1.16.5",
  "PyYAML==6.0.3",
  "regex==2026.5.9",
  "safetensors==0.7.0",
  "scikit-image==0.25.2",
  "scipy==1.15.3",
  "submitit==1.5.4",
  "timm==1.0.27",
  "torchmetrics==1.9.0",
  "tqdm==4.67.3",
  "trimesh==4.12.2",
  "xatlas==0.0.11",
  "zstandard>=0.23,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.12,<1",
]

[project.scripts]
fire3d = "fire3d.cli:main"

[tool.setuptools.packages.find]
include = ["fire3d*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [
  "blender",
  "checkpoints",
  "data",
  "results",
  "third_party/dinov3",
  "trellis2_x2/CuMesh/third_party",
  "trellis2_x2/o-voxel/third_party",
]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
