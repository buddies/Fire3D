# Shape VAE X2 Scaled LC64 Configuration
# Same 1B sparse UNet VAE family as LC32/LC128/LC512 with a 64-channel x2 bottleneck.

models:
  encoder:
    name: SparseUnetVaeEncoder
    args:
      in_channels: 32
      model_channels: [160, 640, 1280]
      latent_channels: 64
      num_blocks: [4, 6, 8]
      block_type:
        - SparseConvNeXtBlock3d
        - SparseConvNeXtBlock3d
        - SparseConvNeXtBlock3d
      down_block_type:
        - SparseResBlockS2C3d
        - SparseResBlockS2C3d
      block_args:
        - use_checkpoint: false
        - use_checkpoint: false
        - use_checkpoint: false
      use_fp16: true
  decoder:
    name: SparseUnetVaeDecoder
    args:
      out_channels: 32
      model_channels: [1280, 640, 160]
      latent_channels: 64
      num_blocks: [8, 6, 4]
      block_type:
        - SparseConvNeXtBlock3d
        - SparseConvNeXtBlock3d
        - SparseConvNeXtBlock3d
      up_block_type:
        - SparseResBlockC2S3d
        - SparseResBlockC2S3d
      block_args:
        - use_checkpoint: false
        - use_checkpoint: false
        - use_checkpoint: false
      use_fp16: true
      pred_subdiv: true

dataset:
  name: SLatShape
  args:
    roots: ${FIRE3D_HCVAE_ROOTS}
    resolution: 32
    min_aesthetic_score: 0.0
    max_tokens: 32768
    use_fp16: true
    latent_key: trellis2_shape_encoding
    pretrained_slat_dec: JeffreyXiang/TRELLIS.2-4B/ckpts/shape_dec_next_dc_f16c32_fp16
    # Normalization stats from shape_vae.json - IMPORTANT for good reconstruction
    normalization:
      mean: [0.781296, 0.018091, -0.495192, -0.558457, 1.060530, 0.093252, 1.518149, -0.933218,
                -0.732996, 2.604095, -0.118341, -2.143904, 0.495076, -2.179512, -2.130751, -0.996944,
                0.261421, -2.217463, 1.260067, -0.150213, 3.790713, 1.481266, -1.046058, -1.523667,
                -0.059621, 2.220780, 1.621212, 0.877230, 0.567247, -3.175944, -3.186688, 1.578665]
      std: [5.972266, 4.706852, 5.445010, 5.209927, 5.320220, 4.547237, 5.020802, 5.444004,
                5.226681, 5.683095, 4.831436, 5.286469, 5.652043, 5.367606, 5.525084, 4.730578,
                4.805265, 5.124013, 5.530808, 5.619001, 5.103930, 5.417670, 5.269677, 5.547194,
                5.634698, 5.235274, 6.110351, 5.511298, 6.237273, 4.879207, 5.347008, 5.405691]

trainer:
  name: ShapeVaeX2Trainer
  args:
    output_dir: outputs/shape_vae_x2
    load_dir: null
    step: null
    batch_size_per_gpu: 256
    batch_split: 1
    max_steps: 100000
    optimizer:
      name: AdamW
      args:
        lr: 8.0e-5
        weight_decay: 0.01
        betas: [0.9, 0.99]
    lr_scheduler: null
    grad_clip: 1.0
    ema_rate: 0.9999
    mix_precision_mode: 'inflat_all'
    mix_precision_dtype: 'float16'
    loss_type: l1
    lambda_kl: 2.0e-6
    lambda_subdiv: 0.2
    i_print: 100
    i_log: 100
    i_sample: 5000
    i_save: 5000
    i_ddpcheck: null
